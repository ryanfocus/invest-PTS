# PTS 設定
#
# 這份檔案是**你要填的**。帳號、密碼、期貨帳號、Discord webhook 不在這裡，
# 在 `.env`（不進版控，格式見 `.env.example`）。
#
# 盤中程式只在啟動時讀一次。當天已經有部位時，交易商品一律以部位檔為準，
# 所以改商品最快下一個交易日才生效（規格第 43 條）。
#
# ⚠️ 開關要寫 true／false，**不加引號**。寫成 "false" 程式會在啟動時擋下來。

order:
  # 自動下單總開關。
  #
  #   false → 模擬模式：照常判斷，發出標示「模擬」的進場訊息，**完全不呼叫下單 API**
  #   true  → 條件成立就送出真實委託
  #
  # ⚠️ **開著的狀態不要 commit。** 有一條測試會在你忘記時變紅。
  auto_enabled: false

  # 交易商品。指標一律看大台，這裡只決定下單的是哪一個。
  #
  #   TX   大台  每點 200 元  標當沖，由券商 13:30 強平
  #   MTX  小台  每點 50 元   標當沖，由券商 13:30 強平
  #   TMF  微台  每點 10 元   不能標當沖，由出場程式 13:25 平倉
  product: TMF

  # 每次進場的口數。期交所限制每筆市價委託最多 10 口，所以上限是 10。
  lots_per_entry: 1

  # 加碼上限：PTS 一天的部位最多幾口，等待中的突破進場也算在內。
  # 程式不檢查保證金，你填多少就可能加到多少。
  max_position: 20

discord:
  # 成交與告警通知。關閉時完全不發出任何請求。
  #
  # ⚠️ 關掉之後，程式出事你不會收到任何通知——它仍然會照常下單。
  enabled: true
